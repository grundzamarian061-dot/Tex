name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Systémové balíčky
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools

      - name: Obnovit cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v3-${{ github.run_id }}
          restore-keys: buildozer-v3-

      - name: Oprava receptu ffpyplayer (nový FFmpeg + stahování z PyPI)
        shell: bash
        run: |
          V=$(curl -s https://pypi.org/pypi/ffpyplayer/json | python -c "import sys,json;print(json.load(sys.stdin)['info']['version'])")
          echo "ffpyplayer verze: $V"
          git clone --depth 1 -b master https://github.com/kivy/python-for-android.git /tmp/p4a
          mkdir -p recipes
          cp -r /tmp/p4a/pythonforandroid/recipes/ffpyplayer recipes/ffpyplayer
          python - "$V" <<'PY'
          import re, sys
          v = sys.argv[1]
          p = "recipes/ffpyplayer/__init__.py"
          s = open(p).read()
          s = re.sub(r"(\n\s*version\s*=\s*)['\"][^'\"]+['\"]", r"\g<1>'" + v + "'", s, count=1)
          s = re.sub(r"(\n\s*url\s*=\s*)['\"][^'\"]+['\"]", r"\g<1>'https://files.pythonhosted.org/packages/source/f/ffpyplayer/ffpyplayer-{version}.tar.gz'", s, count=1)
          open(p, "w").write(s)
          PY
          echo "--- kontrola patchů proti zdrojům $V ---"
          curl -sL "https://files.pythonhosted.org/packages/source/f/ffpyplayer/ffpyplayer-$V.tar.gz" -o /tmp/ff.tgz
          mkdir -p /tmp/ffsrc
          tar xzf /tmp/ff.tgz -C /tmp/ffsrc --strip-components=1
          echo "výskyty avfft ve zdrojích (0 = dobře):"
          grep -rl "avfft" /tmp/ffsrc | wc -l
          cd recipes/ffpyplayer
          for P in *.patch; do
            [ -e "$P" ] || continue
            if patch -t --dry-run -d /tmp/ffsrc -p1 -i "$PWD/$P" > /dev/null 2>&1; then
              echo "patch sedí: $P"
              continue
            fi
            python - "$P" <<'PY2'
          import sys
          p = sys.argv[1]
          out = []
          for ln in open(p, newline="").read().split("\n"):
              ln = ln.rstrip("\r")
              if ln[:1] in (" ", "+", "-") and not ln.startswith(("---", "+++")):
                  ln += "\r"
              out.append(ln)
          open(p, "w", newline="").write("\n".join(out))
          PY2
            if patch -t --dry-run -d /tmp/ffsrc -p1 -i "$PWD/$P" > /dev/null 2>&1; then
              echo "patch sedí po převodu konců řádků: $P"
              continue
            fi
            echo "patch nesedí, odstraňuji: $P"
            rm -f "$P"
            python - "$P" <<'PY3'
          import re, sys
          n = sys.argv[1]
          s = open("__init__.py").read()
          s = re.sub(r"['\"]" + re.escape(n) + r"['\"]\s*,?", "", s)
          open("__init__.py", "w").write(s)
          PY3
          done
          cd ../..
          echo "--- upravený recept ---"
          sed -n 1,30p recipes/ffpyplayer/__init__.py
          sed -i "/^\[app\]/a p4a.local_recipes = $GITHUB_WORKSPACE/recipes" buildozer.spec
          grep -n "local_recipes" buildozer.spec

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Shrnutí chyby
        if: failure()
        shell: bash
        run: |
          {
            echo '## Příčina chyby (řádky před "Command failed")'
            echo '```'
            grep -n -B60 "Command failed" build.log | head -90 || tail -80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Uložit cache (i při chybě)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v3-${{ github.run_id }}

      - name: Nahrát APK
        uses: actions/upload-artifact@v4
        with:
          name: TEx-apk
          path: bin/*.apk

      - name: Nahrát log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Systémové balíčky
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Nahrát APK
        uses: actions/upload-artifact@v4
        with:
          name: TEx-apk
          path: bin/*.apk

      - name: Nahrát log při chybě
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            .buildozer/logs
            .buildozer/android/platform/build-*/build/*.log
          if-no-files-found: ignore

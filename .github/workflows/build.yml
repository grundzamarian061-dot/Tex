name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Systémové balíčky
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache xz-utils

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools

      - name: Obnovit cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v5-${{ github.run_id }}
          restore-keys: buildozer-v5-

      - name: Staré verze - Python 3.11, ffmpeg 6.1.1, ffpyplayer z PyPI
        shell: bash
        run: |
          set -x
          FF=6.1.1
          V=$(curl -s https://pypi.org/pypi/ffpyplayer/json | python -c "import sys,json;print(json.load(sys.stdin)['info']['version'])")
          echo "ffpyplayer verze: $V, ffmpeg verze: $FF"

          git clone --depth 1 -b master https://github.com/kivy/python-for-android.git /tmp/p4a
          mkdir -p recipes
          cp -r /tmp/p4a/pythonforandroid/recipes/ffpyplayer recipes/ffpyplayer
          cp -r /tmp/p4a/pythonforandroid/recipes/ffmpeg recipes/ffmpeg

          echo "=== původní ffmpeg recept ==="
          sed -n 1,90p recipes/ffmpeg/__init__.py

          # zdrojáky pro kontrolu patchů
          curl -sL "https://files.pythonhosted.org/packages/source/f/ffpyplayer/ffpyplayer-$V.tar.gz" -o /tmp/ff.tgz
          mkdir -p /tmp/ffsrc && tar xzf /tmp/ff.tgz -C /tmp/ffsrc --strip-components=1
          curl -sL "https://ffmpeg.org/releases/ffmpeg-$FF.tar.xz" -o /tmp/ffm.txz
          mkdir -p /tmp/ffmsrc && tar xJf /tmp/ffm.txz -C /tmp/ffmsrc --strip-components=1
          ls /tmp/ffmsrc | head -5
          test -f /tmp/ffmsrc/libavcodec/avfft.h && echo "ffmpeg $FF MÁ avfft.h - dobře"

          cat > /tmp/fixrecipe.py <<'PYEOF'
          import re, sys, os, subprocess, glob
          recipe_dir, src_dir, version, url = sys.argv[1:5]
          init = os.path.join(recipe_dir, "__init__.py")
          s = open(init).read()
          s = re.sub(r"(\n\s*version\s*=\s*)['\"][^'\"]+['\"]", r"\g<1>'" + version + "'", s, count=1)
          if url != "-":
              s = re.sub(r"(\n\s*url\s*=\s*)['\"][^'\"]+['\"]", r"\g<1>'" + url + "'", s, count=1)
          open(init, "w").write(s)

          def ok(p):
              r = subprocess.run(["patch", "-t", "--dry-run", "-d", src_dir, "-p1", "-i", os.path.abspath(p)],
                                 capture_output=True)
              return r.returncode == 0

          for p in glob.glob(os.path.join(recipe_dir, "**", "*.patch"), recursive=True):
              if ok(p):
                  print("patch sedi:", p)
                  continue
              out = []
              for ln in open(p, newline="").read().split("\n"):
                  ln = ln.rstrip("\r")
                  if ln[:1] in (" ", "+", "-") and not ln.startswith(("---", "+++")):
                      ln += "\r"
                  out.append(ln)
              open(p, "w", newline="").write("\n".join(out))
              if ok(p):
                  print("patch sedi po prevodu radku:", p)
                  continue
              print("patch NESEDI, odstranuji:", p)
              os.remove(p)
              base = re.escape(os.path.basename(p))
              s = open(init).read()
              s = re.sub(r"['\"][^'\"]*" + base + r"['\"]\s*,?", "", s)
              open(init, "w").write(s)
          PYEOF

          python /tmp/fixrecipe.py recipes/ffpyplayer /tmp/ffsrc "$V" "https://files.pythonhosted.org/packages/source/f/ffpyplayer/ffpyplayer-{version}.tar.gz"
          python /tmp/fixrecipe.py recipes/ffmpeg /tmp/ffmsrc "$FF" "-"

          echo "=== upravený ffmpeg recept ==="
          sed -n 1,90p recipes/ffmpeg/__init__.py
          echo "=== upravený ffpyplayer recept ==="
          sed -n 1,40p recipes/ffpyplayer/__init__.py

          sed -i "/^\[app\]/a p4a.local_recipes = $GITHUB_WORKSPACE/recipes" buildozer.spec
          # Python 3.14 (výchozí v p4a) neumí přeložit Kivy 2.3.0 -> starší Python 3.11
          sed -i "s/^requirements = python3,/requirements = python3==3.11.9,hostpython3==3.11.9,/" buildozer.spec
          grep -n "local_recipes\|^requirements" buildozer.spec

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Shrnutí chyby
        if: failure()
        shell: bash
        run: |
          {
            echo '## Příčina chyby (řádky před "Command failed")'
            echo '```'
            grep -n -B60 "Command failed" build.log | head -90 || tail -80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Uložit cache (i při chybě)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v5-${{ github.run_id }}

      - name: Nahrát APK
        uses: actions/upload-artifact@v4
        with:
          name: TEx-apk
          path: bin/*.apk

      - name: Nahrát log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Systémové balíčky
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools

      - name: Obnovit cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v3-${{ github.run_id }}
          restore-keys: buildozer-v3-

      - name: Nejnovější ffpyplayer (4.5.1 neumí nový FFmpeg)
        shell: bash
        run: |
          V=$(curl -s https://pypi.org/pypi/ffpyplayer/json | python -c "import sys,json;print(json.load(sys.stdin)['info']['version'])")
          echo "ffpyplayer verze: $V"
          sed -i "s/,ffpyplayer,/,ffpyplayer==$V,/" buildozer.spec
          grep -n "^requirements" buildozer.spec

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Shrnutí chyby
        if: failure()
        shell: bash
        run: |
          {
            echo '## Příčina chyby (řádky před "Command failed")'
            echo '```'
            grep -n -B60 "Command failed" build.log | head -90 || tail -80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Uložit cache (i při chybě)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v3-${{ github.run_id }}

      - name: Nahrát APK
        uses: actions/upload-artifact@v4
        with:
          name: TEx-apk
          path: bin/*.apk

      - name: Nahrát log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
